        Continuation 9 adds 029000, 029250, 029500, 029750 and 030000.
        Developed quadratic splitting including p=2, Dedekind-Kummer with the
        index condition, ideal norm forms and proper equivalence, a terminating
        reduction algorithm and examples for class numbers two and three, and
        classification of prime representations of discriminant negative twenty.
        Each manuscript includes nonspoken mathematics, exercises and references.
        Only this content pack is changed; earlier lectures are preserved.
      sources:
