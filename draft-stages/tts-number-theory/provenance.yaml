        integer rings and repaired the Z[sqrt(-5)] factorization using explicit
        prime ideals and a Minkowski ideal-class calculation. Kept the
        Wiener-Ikehara and universal Dedekind ideal theorems visible as cited
        but not yet fully proved dependencies. Added mathematical companions,
        exercises, claim anchors, references and Wikipedia readings; no shared
        code or prior manuscripts were modified.
