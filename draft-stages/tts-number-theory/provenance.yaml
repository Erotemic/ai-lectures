      scope: >-
        Continuation 8 adds 026750, 027625, 027750, 027875 and 028000.
        Completed Newman's bounded-function Tauberian contour theorem, the
        prime number theorem, Dedekind prime-ideal invertibility and unique
        factorization, and local DVR-based ideal norm multiplicativity.
        Added a proof of the general number-field ring-of-integers axioms,
        mathematical companions, exercises, source records, and Wikipedia links.
        Only the number-theory content pack changed; earlier manuscripts retained.
      sources:
