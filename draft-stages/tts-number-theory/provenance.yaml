      scope: >-
        Continuation 11 adds 031750–033000, six number-theory manuscripts.
        Proved general finite p-adic extension structure, unramified/ramified
        decomposition, complete odd and 2-adic Hilbert-symbol formulas with
        index-two norm arguments, local quadratic-form criteria and rational
        Hilbert reciprocity. Explicitly reserved Hasse–Minkowski global existence,
        full p=2 local classification and different/discriminant for future work.
        Included companions, exercises, source metadata and Wikipedia readings.
        Changed only number-theory content-pack text.
